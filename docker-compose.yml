# Control-plane services. On the VPS, from the repository root: docker compose up -d
services:
  market-collector:
    image: python:3.12-slim  # the code needs only the standard library
    working_dir: /app
    volumes:
      - .:/app
    environment:
      VAST_API_KEY: ${VAST_API_KEY:-}
    # Database: data/gpu_node.db in this checkout. One collection run (16 searches) about every
    # hour, then today's report is rewritten.
    command: >-
      sh -c 'while true; do
      python -m collectors.vast.collector;
      python -m analytics.market_report;
      sleep 3600; done'
    restart: unless-stopped
